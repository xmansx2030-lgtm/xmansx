[project]
name = "xmansx-backend"
version = "0.1.0"
description = "منصة المواظبة والمتابعة الطلابية — Backend"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.6,<5.7",
    "django-cors-headers>=4.7,<5",
    "django-csp>=4,<5",
    "argon2-cffi>=23,<26",
    "Pillow>=11,<13",
    "openpyxl>=3.1,<4",
    "drf-spectacular>=0.28,<1",
    "cryptography>=50,<51",
    "gunicorn>=23,<24",
    "sentry-sdk>=2.35,<3",
    "django-storages[s3]>=1.14,<2",
    # توليد المستندات الرسمية: HTML+CSS → PDF مع تشكيل عربي وRTL عبر Pango/HarfBuzz
    # (يحتاج مكتبات النظام المثبتة في Dockerfile — انظر docs/GENERATED_DOCUMENTS.md)
    "weasyprint>=66,<70",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-django>=4.9,<5",
    # فحص المستند الناتج فعليًا (صفحات/نص عربي) بلا OCR — اختبارات فقط
    "pypdf>=5,<7",
]
load = [
    "locust>=2.40,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "DJ",  # flake8-django
    "S",   # bandit (security)
    "UP",  # pyupgrade
]
ignore = [
    "S101", # assert allowed (tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"config/settings/**" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-v --strict-markers"
