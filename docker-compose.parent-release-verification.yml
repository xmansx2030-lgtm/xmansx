# Apply only over docker-compose.parent-verification.yml. Public credentials are
# deliberately local-test values. A distinct project keeps the previous verified
# database, volumes, ports and source checkout untouched.
name: xmansx-parent-release-verification

services:
  postgres:
    ports: !override
      - "127.0.0.1:5545:5432"

  redis:
    ports: !override
      - "127.0.0.1:6400:6379"
    command: redis-server --maxmemory-policy noeviction

  tests:
    image: xmansx-backend:parent-release-verification
    environment:
      PARENT_PORTAL_BASE_URL: http://localhost:5175
      DEV_EXTRA_ORIGINS: http://localhost:5175,http://127.0.0.1:5175

  app:
    image: xmansx-backend:parent-release-verification
    environment:
      PARENT_PORTAL_BASE_URL: http://localhost:5175
      DEV_EXTRA_ORIGINS: http://localhost:5175,http://127.0.0.1:5175
    ports: !override
      - "127.0.0.1:8012:8000"
