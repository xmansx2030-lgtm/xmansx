# Production runtime overlay. Local verification must explicitly opt out of HTTPS/R2/remote backup.
services:
  backup-init:
    image: ${BACKEND_IMAGE:-xmansx-backend:local}
    build:
      context: ./backend
      target: prod
    user: root
    command:
      [
        "sh",
        "-c",
        "chown -R app:app /app/mediafiles /app/privatefiles /app/backups /app/backup-repository",
      ]
    volumes:
      - mediafiles:/app/mediafiles
      - privatefiles:/app/privatefiles
      - backup_staging:/app/backups
      - backup_repository:/app/backup-repository
    restart: "no"

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xmansx_phase17}
      POSTGRES_USER: ${POSTGRES_USER:-xmansx_phase17}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  backend:
    build:
      context: ./backend
      target: prod
    environment: &production-backend-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS is required}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-2592000}
      LOGIN_RATE_LIMIT_IP_MAX: ${LOGIN_RATE_LIMIT_IP_MAX:-20}
      LOGIN_RATE_LIMIT_MOBILE_MAX: ${LOGIN_RATE_LIMIT_MOBILE_MAX:-5}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      PDF_RENDER_CONCURRENCY: ${PDF_RENDER_CONCURRENCY:-4}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      OPERATIONAL_HEARTBEAT_INTERVAL_SECONDS: ${OPERATIONAL_HEARTBEAT_INTERVAL_SECONDS:-120}
      OPERATIONAL_HEARTBEAT_MAX_AGE_SECONDS: ${OPERATIONAL_HEARTBEAT_MAX_AGE_SECONDS:-300}
      POSTGRES_DB: ${POSTGRES_DB:-xmansx_phase17}
      POSTGRES_USER: ${POSTGRES_USER:-xmansx_phase17}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DATABASE_BACKUP_ROOT: /app/backups
      BACKUP_STORAGE_LOCATION: /app/backup-repository
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:-production}
      BACKUP_REMOTE_ENABLED: ${BACKUP_REMOTE_ENABLED:-true}
      BACKUP_REQUIRE_REMOTE: ${BACKUP_REQUIRE_REMOTE:-true}
      BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-true}
      BACKUP_SCHEDULE_INTERVAL_SECONDS: ${BACKUP_SCHEDULE_INTERVAL_SECONDS:-86400}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-93600}
      R2_ENABLED: ${R2_ENABLED:-true}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PRIVATE_BUCKET_NAME: ${R2_PRIVATE_BUCKET_NAME:-}
      R2_BACKUP_BUCKET_NAME: ${R2_BACKUP_BUCKET_NAME:-}
      R2_MEDIA_PREFIX: ${R2_MEDIA_PREFIX:-media}
      R2_DOCUMENTS_PREFIX: ${R2_DOCUMENTS_PREFIX:-documents}
      R2_BACKUPS_PREFIX: ${R2_BACKUPS_PREFIX:-database-backups}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?FIELD_ENCRYPTION_KEYS is required}
      NATIONAL_ID_HMAC_KEY: ${NATIONAL_ID_HMAC_KEY:?NATIONAL_ID_HMAC_KEY is required}
    volumes: !override
      - mediafiles:/app/mediafiles
      - privatefiles:/app/privatefiles
      - backup_staging:/app/backups
      - backup_repository:/app/backup-repository
    depends_on:
      backup-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: prod
    environment: *production-backend-env
    volumes: !override
      - mediafiles:/app/mediafiles
      - privatefiles:/app/privatefiles
      - backup_staging:/app/backups
      - backup_repository:/app/backup-repository
    depends_on:
      backup-init:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
      target: prod
    environment: *production-backend-env
    volumes: !reset []

  frontend:
    build:
      context: ./frontend
      target: prod
    volumes: !reset []
    ports: !override
      - "${FRONTEND_HOST_PORT:-5173}:80"

volumes:
  mediafiles:
  privatefiles:
  backup_staging:
  backup_repository:
