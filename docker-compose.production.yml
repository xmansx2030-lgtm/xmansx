# Production-like local verification overlay. Secrets are required from the invoking shell.
services:
  backup-init:
    build:
      context: ./backend
      target: prod
    user: root
    command:
      [
        "sh",
        "-c",
        "chown -R app:app /app/mediafiles /app/privatefiles /app/backups /app/backup-repository",
      ]
    volumes:
      - mediafiles:/app/mediafiles
      - privatefiles:/app/privatefiles
      - backup_staging:/app/backups
      - backup_repository:/app/backup-repository
    restart: "no"

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xmansx_phase17}
      POSTGRES_USER: ${POSTGRES_USER:-xmansx_phase17}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  backend:
    build:
      context: ./backend
      target: prod
    environment: &production-backend-env
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-2592000}
      POSTGRES_DB: ${POSTGRES_DB:-xmansx_phase17}
      POSTGRES_USER: ${POSTGRES_USER:-xmansx_phase17}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DATABASE_BACKUP_ROOT: /app/backups
      BACKUP_STORAGE_LOCATION: /app/backup-repository
      BACKUP_ENVIRONMENT: ${BACKUP_ENVIRONMENT:-phase18-verification}
      BACKUP_REMOTE_ENABLED: ${BACKUP_REMOTE_ENABLED:-false}
      BACKUP_REQUIRE_REMOTE: ${BACKUP_REQUIRE_REMOTE:-false}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?FIELD_ENCRYPTION_KEYS is required}
      NATIONAL_ID_HMAC_KEY: ${NATIONAL_ID_HMAC_KEY:?NATIONAL_ID_HMAC_KEY is required}
    volumes: !override
      - mediafiles:/app/mediafiles
      - privatefiles:/app/privatefiles
      - backup_staging:/app/backups
      - backup_repository:/app/backup-repository
    depends_on:
      backup-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      target: prod
    environment: *production-backend-env
    volumes: !override
      - mediafiles:/app/mediafiles
      - privatefiles:/app/privatefiles
      - backup_staging:/app/backups
      - backup_repository:/app/backup-repository
    depends_on:
      backup-init:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
      target: prod
    environment: *production-backend-env
    volumes: !reset []

  frontend:
    build:
      context: ./frontend
      target: prod
    volumes: !reset []
    ports: !override
      - "${FRONTEND_HOST_PORT:-5173}:80"

volumes:
  mediafiles:
  privatefiles:
  backup_staging:
  backup_repository:
