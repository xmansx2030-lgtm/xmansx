# Bound active API work across nginx workers; idle browser tabs do not count.
# Keep health probes observable during traffic saturation. No school/IP key.
map $uri $api_capacity_key {
    default $server_name;
    /api/v1/health/ "";
    /api/v1/readiness/ "";
}
limit_conn_zone $api_capacity_key zone=api_capacity:1m;

# Resolve a replacement service asynchronously, including when DNS is absent
# at startup. OSS nginx >=1.27.3 supports resolve with a shared upstream zone.
upstream xmansx_backend {
    zone xmansx_backend 64k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    server ${BACKEND_HOSTPORT} resolve;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 8s;
}

# Production frontend: static SPA + proxy /api لنفس الـ Origin (تقليل CORS)
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress API JSON and static text assets. This materially lowers network
    # and proxy pressure for large school dashboards without caching private data.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript application/manifest+json
        image/svg+xml text/css text/plain application/xml;

    include /etc/nginx/snippets/xmansx-security-headers.conf;
    include /etc/nginx/snippets/xmansx-indexing.conf;
    include /etc/nginx/snippets/xmansx-seo-locations.conf;
    error_page 404 /404.html;

    location /api/ {
        limit_conn api_capacity ${API_MAX_INFLIGHT};
        limit_conn_status 503;
        error_page 503 = @api_busy;
        proxy_pass http://xmansx_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        # The deployment boundary declares its public scheme explicitly.
        # Render uses HTTPS after terminating TLS; local production-like tests
        # retain the image default (HTTP) so secure-cookie checks stay accurate.
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    }

    location @api_busy {
        default_type application/json;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Retry-After "2" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        return 503 '{"code":"SERVICE_BUSY","message":"الخدمة مشغولة مؤقتاً، حاول بعد قليل.","details":{}}';
    }

    location = /index.html {
        return 301 /$is_args$args;
    }

    location = /robots.txt {
        default_type text/plain;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location = /app.html {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-[a-zA-Z0-9_-]+\.js$ {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
