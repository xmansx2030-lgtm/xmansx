# Production frontend: static SPA + proxy /api لنفس الـ Origin (تقليل CORS)
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve Render's private-service hostname at request time. During a new
    # deploy the hostname can be briefly absent while the private instance is
    # replaced; resolving it while nginx parses this file would abort startup.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend_upstream "${BACKEND_HOSTPORT}";

    include /etc/nginx/snippets/xmansx-security-headers.conf;

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        # Render redirects public HTTP to HTTPS, terminates TLS, then forwards
        # plain HTTP to this container. Tell Django the original public scheme
        # explicitly so SECURE_SSL_REDIRECT cannot loop on the proxy hop.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    location = /index.html {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
