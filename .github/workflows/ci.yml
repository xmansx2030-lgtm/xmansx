name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, checks, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: xmansx
      POSTGRES_USER: xmansx
      POSTGRES_PASSWORD: xmansx-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_HOST_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Configure Docker Hub cache before CI services
        working-directory: .
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Start isolated backend dependencies
        run: docker compose -p xmansx-backend-ci -f ../docker-compose.yml up -d --wait postgres redis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit
      - name: Ruff lint
        run: ruff check .
      - name: Django system checks
        run: python manage.py check
      - name: Migration check (no missing migrations)
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema generation
        run: python manage.py spectacular --file /tmp/schema.yml --validate
      - name: Tests
        run: pytest
      - name: Stop isolated backend dependencies
        if: always()
        run: docker compose -p xmansx-backend-ci -f ../docker-compose.yml down -v

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Verify public SEO artifacts
        run: npm run seo:check

  bridge:
    name: Device bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest bridge/tests -q

  production-browser:
    name: Production-like browser shard ${{ matrix.shard }}
    needs: [backend, frontend, bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DJANGO_SECURE_SSL_REDIRECT: "false"
      POSTGRES_DB: xmansx_e2e
      POSTGRES_USER: xmansx_e2e
      POSTGRES_PASSWORD: xmansx-e2e-only
      REDIS_URL: redis://redis:6379/0
      BACKUP_ENVIRONMENT: ci-production-gate
      BACKUP_REMOTE_ENABLED: "false"
      BACKUP_REQUIRE_REMOTE: "false"
      BACKUP_SCHEDULE_ENABLED: "false"
      R2_ENABLED: "false"
      LOGIN_RATE_LIMIT_IP_MAX: "500"
      E2E_COMPOSE_PROJECT: xmansx-ci
      E2E_PRODUCTION_LIKE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Configure Docker Hub cache before isolated stack
        run: bash .github/scripts/configure-docker-mirror.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate CI-only production keys
        shell: bash
        run: |
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "NATIONAL_ID_HMAC_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEYS=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install openpyxl
      - name: Start production-like stack
        run: |
          docker compose -p xmansx-ci -f docker-compose.yml -f docker-compose.production.yml build \
            --build-arg "PYTHON_BASE_IMAGE=$XMAN_CI_PYTHON_IMAGE" \
            --build-arg "NODE_BASE_IMAGE=$XMAN_CI_NODE_IMAGE" \
            --build-arg "NGINX_BASE_IMAGE=$XMAN_CI_NGINX_IMAGE" \
            --build-arg "BUILDKIT_SYNTAX=$XMAN_CI_DOCKERFILE_IMAGE"
          docker compose -p xmansx-ci -f docker-compose.yml -f docker-compose.production.yml up -d --no-build
      - name: Apply migrations
        run: >-
          docker compose -p xmansx-ci -f docker-compose.yml
          -f docker-compose.production.yml exec -T backend
          python manage.py migrate --noinput
      - name: Verify crawler responses, private metadata and PWA installation
        if: matrix.shard == 1
        working-directory: frontend
        env:
          SEO_BASE_URL: http://localhost:5173
        run: npm run seo:test
      - name: Run all browser journeys
        working-directory: frontend
        # Same eight shards as e2e:release, with an independent seeded database
        # on each runner. Keep the serial files, assertions and retry policy.
        run: npm run e2e -- --workers=1 --retries=1 --shard=${{ matrix.shard }}/8
      - name: Preserve service diagnostics
        if: failure()
        run: >-
          docker compose -p xmansx-ci -f docker-compose.yml
          -f docker-compose.production.yml logs --no-color --tail=300
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-traces-${{ matrix.shard }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: >-
          docker compose -p xmansx-ci -f docker-compose.yml
          -f docker-compose.production.yml down -v

  production-e2e:
    name: Production-like browser gate
    needs: [production-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard to pass
        env:
          SHARDS_RESULT: ${{ needs.production-browser.result }}
        run: test "$SHARDS_RESULT" = success

  parent-browser:
    name: Parent TLS (${{ matrix.journey }})
    needs: [backend, frontend, bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        journey: [parent-family-invitations, parent-email-activation, parent-email-recovery, parent-portal, parent-family-followup]
    env:
      E2E_BASE_URL: https://localhost:8445
      COMPOSE_PROJECT_NAME: xmansx-parent-email-activation-synthetic-staging
      PARENT_E2E_PREVIEW: "1"
      PARENT_E2E_EXTERNAL_PREVIEW: "1"
      PARENT_E2E_SYNTHETIC_STAGING: "1"
      PARENT_VERIFICATION_LOCAL_ONLY: "1"
      E2E_SEED_PASSWORD: Parent-Staging-Local-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Configure Docker Hub cache before isolated stack
        run: bash .github/scripts/configure-docker-mirror.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build browser client
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Prepare fresh private synthetic TLS stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/parent-staging
          vf=(-p xmansx-parent-ci-materials -f docker-compose.parent-verification.yml -f docker-compose.parent-release-verification.yml -f docker-compose.parent-email-verification.yml)
          docker compose "${vf[@]}" build --build-arg "PYTHON_BASE_IMAGE=$XMAN_CI_PYTHON_IMAGE" --build-arg "BUILDKIT_SYNTAX=$XMAN_CI_DOCKERFILE_IMAGE" tests
          docker compose "${vf[@]}" run --rm --no-deps --user "$(id -u):$(id -g)" --volume "$PWD/artifacts/parent-staging:/materials" tests python /workspace/scripts/parent_staging_materials.py --output /materials
          sf=(--env-file artifacts/parent-staging/.env -f docker-compose.parent-verification.yml -f docker-compose.parent-release-verification.yml -f docker-compose.parent-staging.yml -f docker-compose.parent-email-verification.yml -f docker-compose.parent-family-verification.yml)
          docker compose "${sf[@]}" up -d --wait postgres redis
          docker compose "${sf[@]}" run --rm --no-deps tests python /workspace/scripts/parent_portal_verification_init.py
          if [[ '${{ matrix.journey }}' == parent-family-invitations ]]; then
            docker compose "${sf[@]}" run --rm --no-deps --volume "$PWD/artifacts/parent-staging:/fixtures" -e DJANGO_SETTINGS_MODULE=config.settings.local tests python manage.py seed_parent_family_invitations --password "$E2E_SEED_PASSWORD" --output /fixtures/fixture.json
          else
            docker compose "${sf[@]}" run --rm --no-deps --volume "$PWD/artifacts/parent-staging:/fixtures" -e DJANGO_SETTINGS_MODULE=config.settings.local tests python manage.py seed_parent_staging --password "$E2E_SEED_PASSWORD" --output /fixtures/fixture.json --enable-registration
          fi
          sudo chown "$(id -u):$(id -g)" artifacts/parent-staging/fixture.json
          chmod 600 artifacts/parent-staging/fixture.json
          docker compose "${sf[@]}" run --rm --no-deps staging-storage-init
          docker compose "${sf[@]}" build --build-arg "NODE_BASE_IMAGE=$XMAN_CI_NODE_IMAGE" --build-arg "NGINX_BASE_IMAGE=$XMAN_CI_NGINX_IMAGE" --build-arg "BUILDKIT_SYNTAX=$XMAN_CI_DOCKERFILE_IMAGE" staging-frontend
          docker compose "${sf[@]}" up -d staging-app staging-worker staging-beat staging-frontend
          echo "NODE_EXTRA_CA_CERTS=$PWD/artifacts/parent-staging/localhost.crt" >> "$GITHUB_ENV"
          echo "PARENT_E2E_FIXTURE=$PWD/artifacts/parent-staging/fixture.json" >> "$GITHUB_ENV"
      - name: Run journey on its own fresh TLS database and security Redis
        shell: bash
        run: |
          set -euo pipefail
          # Each matrix job owns a fresh database and Redis on its own runner.
          # Keep the actual 20/IP/300s and mobile limits; no Redis flushing.
          cd frontend
          npx --no-install playwright test --config playwright.parent.config.ts '${{ matrix.journey }}.spec.ts'
      - name: Stop only the isolated CI stack
        if: always()
        run: >-
          docker compose --env-file artifacts/parent-staging/.env
          -f docker-compose.parent-verification.yml
          -f docker-compose.parent-release-verification.yml
          -f docker-compose.parent-staging.yml
          -f docker-compose.parent-email-verification.yml
          -f docker-compose.parent-family-verification.yml down -v

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
      - name: Scan complete history including merged branches
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks-8.24.3/gitleaks git --redact --log-opts="--all" --no-banner
          /tmp/gitleaks-8.24.3/gitleaks dir --redact --no-banner
