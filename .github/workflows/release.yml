name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  images:
    name: Build immutable production images
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            release_sha="$WORKFLOW_SHA"
          else
            release_sha="$DISPATCH_SHA"
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ steps.release.outputs.repository }}/backend:${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ steps.release.outputs.repository }}/frontend:${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Publish release coordinates
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ steps.release.outputs.repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          {
            echo "### Immutable release"
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- Backend: \`ghcr.io/$REPOSITORY/backend:$RELEASE_SHA\`"
            echo "- Backend digest: \`$BACKEND_DIGEST\`"
            echo "- Frontend: \`ghcr.io/$REPOSITORY/frontend:$RELEASE_SHA\`"
            echo "- Frontend digest: \`$FRONTEND_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
