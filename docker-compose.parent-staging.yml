# Optional local-only production-like overlay after base + release-verification.
# Never use it for public hosting: loopback TLS, synthetic DB and no egress.
name: xmansx-parent-synthetic-staging
x-staging-environment: &staging-environment
  DJANGO_SETTINGS_MODULE: config.settings.parent_staging
  PARENT_STAGING_LOCAL_ONLY: "1"
  POSTGRES_DB: parent_verification
  POSTGRES_USER: parent_verify_app
  POSTGRES_PASSWORD: parent-verify-app-local-only
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  DJANGO_ALLOWED_HOSTS: localhost
  DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost:8445
  DJANGO_CORS_ALLOWED_ORIGINS: ""
  DJANGO_ADMIN_ENABLED: "false"
  SELF_REGISTRATION_ENABLED: "false"
  PARENT_PORTAL_BASE_URL: https://localhost:8445
  PARENT_RECOVERY_EMAIL_ENABLED: "true"
  PARENT_RECOVERY_EMAIL_ADAPTER: synthetic-file
  PARENT_RECOVERY_SYNTHETIC_EMAIL_ROOT: /var/lib/xmansx-parent-staging/email-outbox
  RESEND_API_KEY: ""
  RESEND_FROM_EMAIL: ""
  REDIS_URL: redis://redis:6379/0
  CACHE_REDIS_URL: redis://redis:6379/0
  SECURITY_REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/3
  CELERY_RESULT_BACKEND: redis://redis:6379/4
  GENERATED_DOCUMENTS_ROOT: /var/lib/xmansx-parent-staging/private
  MEDIA_ROOT: /tmp/parent-verification/media
  DATABASE_BACKUP_ROOT: /var/lib/xmansx-parent-staging/backups
  BACKUP_STORAGE_LOCATION: /var/lib/xmansx-parent-staging/repository
  BACKUP_ENVIRONMENT: synthetic-staging
  BACKUP_REMOTE_ENABLED: "false"
  BACKUP_REQUIRE_REMOTE: "false"
  BACKUP_SCHEDULE_ENABLED: "false"
  MINISTRY_CALENDAR_ENABLED: "false"
  R2_ENABLED: "false"
  R2_BACKUP_ENABLED: "false"
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: synthetic-staging

services:
  postgres:
    ports: !reset []
    networks: [default, synthetic-staging]
  redis:
    ports: !reset []
    networks: [default, synthetic-staging]
  app:
    profiles: [diagnostic-http]
    ports: !reset []
  tests:
    # Replace the inherited private mount rather than expose the same volume at
    # both the old temporary destination and the durable staging destination.
    volumes: !override
      - ./:/workspace:ro
      - verification_private:/var/lib/xmansx-parent-staging/private
      - verification_backups:/var/lib/xmansx-parent-staging/backups
      - verification_repository:/var/lib/xmansx-parent-staging/repository
      - recovery_email_outbox:/var/lib/xmansx-parent-staging/email-outbox
    environment:
      # Pass --env-file artifacts/parent-staging/.env to Compose. These random
      # keys belong only to this project's independent PostgreSQL/private volumes.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Generate ignored staging materials first}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?Generate ignored staging materials first}
      NATIONAL_ID_HMAC_KEY: ${NATIONAL_ID_HMAC_KEY:?Generate ignored staging materials first}
      PARENT_PORTAL_BASE_URL: https://localhost:8445
      PARENT_STAGING_LOCAL_ONLY: "1"
      SELF_REGISTRATION_ENABLED: "false"
      PARENT_RECOVERY_EMAIL_ADAPTER: synthetic-file
      PARENT_RECOVERY_SYNTHETIC_EMAIL_ROOT: /var/lib/xmansx-parent-staging/email-outbox
      RESEND_API_KEY: ""
      GENERATED_DOCUMENTS_ROOT: /var/lib/xmansx-parent-staging/private
      DATABASE_BACKUP_ROOT: /var/lib/xmansx-parent-staging/backups
      BACKUP_STORAGE_LOCATION: /var/lib/xmansx-parent-staging/repository
  staging-storage-init:
    image: xmansx-backend:parent-release-verification
    working_dir: /workspace/backend
    user: root
    environment:
      PARENT_STAGING_LOCAL_ONLY: "1"
      POSTGRES_DB: parent_verification
      POSTGRES_HOST: postgres
      GENERATED_DOCUMENTS_ROOT: /var/lib/xmansx-parent-staging/private
      DATABASE_BACKUP_ROOT: /var/lib/xmansx-parent-staging/backups
      BACKUP_STORAGE_LOCATION: /var/lib/xmansx-parent-staging/repository
      PARENT_RECOVERY_SYNTHETIC_EMAIL_ROOT: /var/lib/xmansx-parent-staging/email-outbox
    volumes:
      - ./:/workspace:ro
      - verification_private:/var/lib/xmansx-parent-staging/private
      - verification_backups:/var/lib/xmansx-parent-staging/backups
      - verification_repository:/var/lib/xmansx-parent-staging/repository
      - recovery_email_outbox:/var/lib/xmansx-parent-staging/email-outbox
    command: python /workspace/scripts/parent_staging_storage.py
    networks: [synthetic-staging]
    restart: "no"
  staging-app:
    image: xmansx-backend:parent-release-verification
    working_dir: /workspace/backend
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./artifacts/parent-staging/.env
    environment: *staging-environment
    volumes:
      - ./:/workspace:ro
      - verification_private:/var/lib/xmansx-parent-staging/private
      - verification_backups:/var/lib/xmansx-parent-staging/backups
      - verification_repository:/var/lib/xmansx-parent-staging/repository
      - recovery_email_outbox:/var/lib/xmansx-parent-staging/email-outbox
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 1 --timeout 60 --access-logfile - --access-logformat '%(m)s %(s)s %(D)s' --error-logfile -
    networks: [synthetic-staging]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      staging-storage-init: {condition: service_completed_successfully}
  staging-worker:
    image: xmansx-backend:parent-release-verification
    working_dir: /workspace/backend
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./artifacts/parent-staging/.env
    environment: *staging-environment
    volumes:
      - ./:/workspace:ro
      - verification_private:/var/lib/xmansx-parent-staging/private
      - verification_backups:/var/lib/xmansx-parent-staging/backups
      - verification_repository:/var/lib/xmansx-parent-staging/repository
      - recovery_email_outbox:/var/lib/xmansx-parent-staging/email-outbox
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    command: celery -A config worker --loglevel INFO --concurrency 1 --queues celery,imports,maintenance
    networks: [synthetic-staging]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      staging-storage-init: {condition: service_completed_successfully}
  staging-beat:
    image: xmansx-backend:parent-release-verification
    working_dir: /workspace/backend
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ./artifacts/parent-staging/.env
    environment: *staging-environment
    volumes:
      - ./:/workspace:ro
    tmpfs:
      - /tmp:uid=65534,gid=65534,mode=0700
    command: celery -A config beat --loglevel INFO --schedule /tmp/celerybeat-schedule
    networks: [synthetic-staging]
    depends_on:
      redis: {condition: service_healthy}
  staging-frontend:
    image: xmansx-frontend:parent-synthetic-staging
    build:
      context: ./frontend
      target: prod
    environment:
      PORT: "443"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./infra/parent-staging-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./artifacts/parent-staging/localhost.crt:/materials/localhost.crt:ro
      - ./artifacts/parent-staging/localhost.key:/materials/localhost.key:ro
    ports:
      - "127.0.0.1:8445:443"
    # Docker does not publish host ports from an internal-only network. Only the
    # static TLS edge gets the ingress bridge; app/worker/beat remain internal.
    networks: [default, synthetic-staging]
    depends_on: [staging-app]

networks:
  synthetic-staging:
    internal: true

volumes:
  recovery_email_outbox:
  verification_backups:
  verification_repository:
