# Local-only TLS boundary. Backend/Redis/PostgreSQL are not reachable externally.
log_format synthetic_safe '$request_method $status $request_time';
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /materials/localhost.crt;
    ssl_certificate_key /materials/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    # Do not persist token-bearing URLs, query strings, identifiers or cookies.
    access_log /dev/stdout synthetic_safe;
    include /etc/nginx/snippets/xmansx-security-headers.conf;

    location /api/ {
        proxy_pass http://staging-app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }
    location = /sw.js {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /index.html {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location /assets/ {
        include /etc/nginx/snippets/xmansx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
